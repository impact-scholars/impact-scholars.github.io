version: 1
extends:
- nexus.yml

project:
  id: impact-scholars-home
  title: Impact Scholars Gallery
  description: A gallery of micropublications from the Neuromatch Impact Scholars Program
  github: https://github.com/impact-scholars/impact-scholars.github.io
  open_access: true
  license:
    content: CC-BY-4.0
  references:
    spec: https://mystmd.org/spec
    barrionuevo-2023: https://impact-scholars.github.io/barrionuevo-2023-burned-area-patagonia
    hartzell-2023: https://impact-scholars.github.io/hartzell-2023-oceanic-oscillations-congo
    oliveira-2023: https://impact-scholars.github.io/oliveira-2023-landcover-tropical-agriculture
    porteous-2023: https://impact-scholars.github.io/porteous-2023-ecco-tides-maria
    pozo-2023: https://impact-scholars.github.io/pozo-2023-cloud-ndvi-eastafrica
    ray-2023: https://impact-scholars.github.io/ray-2023-enso-upwelling-africa
    shree-2023: https://impact-scholars.github.io/shree-2023-enso-climate-pacific
    thomas-2023: https://impact-scholars.github.io/thomas-2023-precipitation-extremes-india
    yang-2023: https://impact-scholars.github.io/yang-2023-enso-iod-monsoon

  plugins:
  - plugins/paper-gallery.mjs
  toc:
  - title: Home
    file: pages/index.md
  - title: Impact Scholars Program
    file: pages/impact-scholars.md
    children:
    - title: 2025 Edition
      file: pages/impact-scholars/impact-scholars-2025.md
    - title: 2024 Edition
      file: pages/impact-scholars/impact-scholars-2024.md
    - title: 2023 Edition
      file: pages/impact-scholars/impact-scholars-2023.md
  - title: How to Participate
    file: pages/submission-guidelines.md
  - title: Tutorials
    file: pages/tutorials.md
    children:
    - title: ISP Tutorial
      file: pages/tutorials/ISP-intro.md
    - title: Why MyST?
      file: pages/tutorials/why-myst.md
    - title: MyST - A Deeper Dive
      file: pages/tutorials/myst-deeper.md
    - title: Conda/Mamba Tutorial
      file: pages/tutorials/conda-tutorial.md

site:
  # template: ../myst-theme/.deploy/book/template.yml
  template: https://github.com/pollomarzo/myst-theme/releases/download/v0.2.0+test/book-theme.zip
  options:
    hide_toc: false
  parts:
    footer: static/parts/footer.md
    primary_sidebar_footer: static/parts/sidebar-footer.md
